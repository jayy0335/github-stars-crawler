name: GitHub Stars Crawler

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:    

jobs:
  crawl:
    runs-on: :contentReference[oaicite:0]{index=0}

    services:
      postgres:
        image: :contentReference[oaicite:1]{index=1}
        env:
          POSTGRES_USER: ${{ secrets.PGUSER }}
          POSTGRES_PASSWORD: ${{ secrets.PGPASSWORD }}
          POSTGRES_DB: ${{ secrets.PGDATABASE }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.PGUSER }}"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: :contentReference[oaicite:2]{index=2}@v3

      - name: Setup Python
        uses: :contentReference[oaicite:3]{index=3}@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests psycopg2

      - name: Run Crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPORT: 5432
        run: python main.py

      - name: Upload CSV Artifact
        uses: :contentReference[oaicite:4]{index=4}@v3
        with:
          name: repos_stars
          path: artifacts/repos_stars.csv
