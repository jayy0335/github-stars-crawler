name: GitHub Stars Crawler

on:
  push:
    branches:
      - github-stars-crawler
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # SPEED BOOST: Cache pip packages
      - name: Cache Python Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare artifacts folder
        run: mkdir -p artifacts

      - name: Wait for Postgres (Fast)
        run: |
          echo "Waiting for Postgres..."
          until pg_isready -h localhost -p 5432 -U postgres -d postgres >/dev/null 2>&1; do
            echo "Not ready, retrying..."
            sleep 1
          done
          echo "Postgres ready!"

      - name: Run Crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_1 }},${{ secrets.GITHUB_TOKEN_2 }}
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PGPORT: 5432
          TARGET_COUNT: 100000
          DAYS_PER_SLICE: 3
          BATCH_SIZE: 2000
          OUT_CSV: artifacts/repos_stars.csv
        run: |
          mkdir -p artifacts
          python main.py || echo "⚠️ Crawler crashed but continuing workflow"

      - name: Ensure CSV exists
        run: |
          if [ ! -f artifacts/repos_stars.csv ]; then
            echo "repo_id,name_with_owner,repo_name,owner_login,url,stars,fetched_at" > artifacts/repos_stars.csv
          fi

      - name: Zip CSV Artifact
        run: |
          zip -j artifacts/repos_stars.zip artifacts/repos_stars.csv

      - name: Upload Zipped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repos_stars
          path: artifacts/repos_stars.zip
