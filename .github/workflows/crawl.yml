name: GitHub Stars Crawler

# Trigger on pushes to your branch, manual dispatch, or daily schedule
on:
  push:
    branches:
      - github-crawler  # your branch name
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # daily at midnight UTC

jobs:
  crawl:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests psycopg2

      - name: Prepare artifacts folder
        run: mkdir -p artifacts

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Postgres not ready yet... waiting 2s"
            sleep 2
          done

      - name: Run Crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PGPORT: 5432
          TARGET_COUNT: 100000
          DAYS_PER_SLICE: 3
          BATCH_SIZE: 200
          OUT_CSV: artifacts/repos_stars.csv
        run: |
          # Ensure CSV folder and file exists
          mkdir -p artifacts
          if [ ! -f artifacts/repos_stars.csv ]; then
            echo "repo_id,name_with_owner,repo_name,owner_login,url,stars,fetched_at" > artifacts/repos_stars.csv
          fi
          python main.py

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repos_stars
          path: artifacts/repos_stars.csv
