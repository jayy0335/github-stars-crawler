name: Crawl GitHub Stars

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'   # daily run at 02:00 UTC (optional)

jobs:
  crawl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      # TARGET_COUNT - you can reduce for testing
      TARGET_COUNT: 1000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Wait for Postgres service
        run: |
          echo "Waiting for Postgres..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done
          pg_isready -h localhost -p 5432 -U postgres

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests

      - name: Create schema
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -f sql/setup_schema.sql

      - name: Force alter repo_id to TEXT
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "ALTER TABLE repositories ALTER COLUMN repo_id TYPE TEXT;"



      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          TARGET_COUNT: ${{ env.TARGET_COUNT }}
          OUT_CSV: /tmp/repos_stars.csv
        run: |
          python crawl_stars.py
          ls -lh /tmp/repos_stars.csv

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: repos-stars
          path: /tmp/repos_stars.csv
